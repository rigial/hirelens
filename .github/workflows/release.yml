name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
            target: 'universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
            target: ''
            rust_targets: ''
            args: ''
          - platform: 'windows-latest'
            os_name: 'Windows'
            target: ''
            rust_targets: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: |
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and Publish Tauri Release
        uses: tauri-apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'HireLens ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### HireLens ${{ github.event.inputs.tag_name || github.ref_name }}
            
            Privacy-first local AI resume parsing and candidate ranking assistant.
            
            #### Assets Included
            - **macOS**: `.dmg` Universal Disk Image (Apple Silicon & Intel)
            - **Windows**: `.msi` (Windows Installer) & `.exe` (NSIS Setup)
            - **Linux**: `.deb` (Debian/Ubuntu) & `.AppImage` (Universal Linux)
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          args: ${{ matrix.args }}
