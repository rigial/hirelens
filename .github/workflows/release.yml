name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (must start with "v", e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_draft.outputs.release_id }}
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve_tag.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve and validate tag
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+ ]]; then
            echo "Error: Release tag must follow semver format starting with 'v' (e.g. v1.0.0, v0.1.0-beta.1), got: '$TAG'"
            exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          
          if [[ "$TAG" =~ (alpha|beta|rc|preview) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft Release
        id: create_draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.resolve_tag.outputs.is_prerelease }}
        run: |
          RELEASE_BODY="### HireLens $TAG_NAME

Privacy-first local AI resume parsing and candidate ranking assistant.

#### Assets Included
- **macOS**: \`.dmg\` Universal Disk Image (Apple Silicon & Intel)
- **Windows**: \`.msi\` (Windows Installer) & \`.exe\` (NSIS Setup)
- **Linux**: \`.deb\` (Debian/Ubuntu) & \`.AppImage\` (Universal Linux)"

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          EXISTING_RELEASE=$(gh release view "$TAG_NAME" --json id -q '.id' 2>/dev/null || true)
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Using existing release: $EXISTING_RELEASE"
            echo "release_id=$EXISTING_RELEASE" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG_NAME" \
              --draft \
              $PRERELEASE_FLAG \
              --title "HireLens $TAG_NAME" \
              --notes "$RELEASE_BODY" \
              --target "${{ github.sha }}"
            
            FETCHED_ID=$(gh release view "$TAG_NAME" --json id -q '.id')
            echo "release_id=$FETCHED_ID" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build (${{ matrix.platform }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
            target: 'universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            os_name: 'Linux'
            target: ''
            rust_targets: ''
            args: ''
          - platform: 'windows-latest'
            os_name: 'Windows'
            target: ''
            rust_targets: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: |
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and Upload Tauri Release Artifacts
        uses: tauri-apps/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: 'HireLens ${{ needs.prepare-release.outputs.tag_name }}'
          releaseDraft: true
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: [prepare-release, build-and-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          echo "All platform builds succeeded. Publishing draft release for $TAG_NAME..."
          gh release edit "$TAG_NAME" --draft=false
          echo "Release published successfully: https://github.com/rigial/hirelens/releases/tag/$TAG_NAME"
